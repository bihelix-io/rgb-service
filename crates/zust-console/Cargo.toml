[package]
name = "zust-console"
version.workspace = true
description = "Zust console for driving BiHelix RGB service flows"
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"

[[bin]]
name = "zust-console"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
attohttpc = "0.30"
bip39 = "2"
dynamic = { package = "zust-dynamic", version = "0.9.12" }
getrandom = "0.3"
iroh = "1.0.0-rc.0"
ldk-node = "0.7.0"
lightning = { path = "../ln-rgb-lightning" }
lightning-invoice = "0.34.0"
root = { package = "zust-root", version = "0.9.6" }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "rt-multi-thread", "time"] }
vm = { package = "zust-vm", version = "0.9.66" }
