[package]
name = "wallet-v2-reader"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "wallet-v2-reader"
path = "src/main.rs"

[dependencies]
bdk_wallet = { version = "=1.1.0", features = ["file_store"] }
bitcoin = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
