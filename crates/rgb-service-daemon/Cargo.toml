[package]
name = "rgb-service-daemon"
version.workspace = true
description = "BiHelix RGB service HTTP daemon"
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"

[[bin]]
name = "rgb-service"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true, features = ["tokio", "query"] }
bdk_electrum = "0.23.2"
bdk_esplora = { version = "0.22.2", features = ["blocking"] }
bdk_wallet = { version = "=2.2.0", features = ["file_store"] }
bincode = "1.3"
bitcoin = { workspace = true }
dynamic = { workspace = true }
fjall = { workspace = true }
rgb-service-local = { version = "0.11.1-rc.10", path = "../rgb-service-local" }
rgb-service-api = { workspace = true, features = ["axum"] }
serde = { package = "serde", version = "1", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "time"] }
toml = { workspace = true }
tower-http = { version = "0.6.11", features = ["cors"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
