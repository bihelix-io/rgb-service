[package]
name = "rgb-service-daemon"
version.workspace = true
description = "BiHelix RGB service HTTP daemon"
keywords.workspace = true
categories.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
readme = "README.md"

[[bin]]
name = "rgb-service"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true, features = ["tokio"] }
bitcoin = { workspace = true }
fjall = { workspace = true }
rgb-service-local = { version = "0.11.1-rc.10", path = "../rgb-service-local" }
rgb-service-api = { workspace = true, features = ["axum"] }
serde = { package = "serde", version = "1", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
